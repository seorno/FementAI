services:
  - type: web
    name: fermentai-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && PYTHONPATH=. uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FERMENTAI_CORS_ORIGINS
        sync: false
